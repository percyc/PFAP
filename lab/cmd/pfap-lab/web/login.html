<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · PFAP Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 60% 0,#174333,transparent 42%),#08100e;color:#edf7f2;font:14px system-ui}.box{width:min(390px,calc(100vw - 36px));padding:32px;border:1px solid #294038;border-radius:18px;background:#101b18;box-shadow:0 30px 90px #0008}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:#55e6a5;color:#07120e;font-size:22px;font-weight:900}h1{font-size:26px;margin:22px 0 7px}p{color:#90a69d;margin:0 0 24px}label{display:grid;gap:8px;color:#90a69d}input{width:100%;border:1px solid #294038;border-radius:9px;padding:13px;background:#09120f;color:white;font-size:16px;outline:none}input:focus{border-color:#55e6a5}button{width:100%;margin-top:14px;border:0;border-radius:9px;padding:13px;background:#55e6a5;color:#07120e;font-weight:800;cursor:pointer}.error{height:20px;margin-top:12px;color:#ff7185}</style></head><body><form class="box" id="login"><div class="mark">P</div><h1>PFAP Lab</h1><p>登录多节点隐私交易实验平台</p><label>访问密码<input id="password" type="password" autocomplete="current-password" autofocus required></label><button>登录</button><div class="error" id="error"></div></form><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(r.ok)location.href='/';else error.textContent=(await r.json()).error||'登录失败'}</script></body></html>
